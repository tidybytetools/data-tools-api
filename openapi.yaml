openapi: 3.0.3
info:
  title: Tidy Byte Data Tools API
  description: "\nClean up messy data with five small tools: pull tables from a text PDF,\nturn a PDF or HTML file into Markdown, check links, split Markdown into\nchunks, and shape or flatten JSON.\n\nHonest limits:\n- Text PDFs only. Scanned or image-only pages are skipped and listed.\n- No OCR and no password-protected PDFs (unless you send the password for Markdown).\n- Uploads can be up to 8 MB. Link checks are capped at 25 URLs per call.\n- Files are processed in memory and discarded. Nothing is stored.\n\nThese tools use the same code as our free lite packages on PyPI.\n"
  contact:
    name: Tidy Byte Tools
    url: "https://tidybytetools.github.io/"
  license:
    name: MIT
    url: "https://opensource.org/licenses/MIT"
  version: 1.0.0
paths:
  /health:
    get:
      tags:
        - health
      summary: Liveness check
      operationId: health_health_get
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
        - health
      summary: Readiness check
      operationId: ready_ready_get
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Ready Ready Get
  /:
    get:
      tags:
        - health
      summary: Service info
      operationId: root__get
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Root  Get
  /v1/pdf-tables:
    post:
      tags:
        - pdf-tables
      summary: Pull tables out of a text PDF
      operationId: pdf_tables_v1_pdf_tables_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_pdf_tables_v1_pdf_tables_post"
        required: true
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema: {}
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /v1/to-markdown:
    post:
      tags:
        - markdown
      summary: Turn a text PDF or HTML file into Markdown
      operationId: to_markdown_v1_to_markdown_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_to_markdown_v1_to_markdown_post"
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response To Markdown V1 To Markdown Post
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /v1/link-check:
    post:
      tags:
        - links
      summary: Check links for status codes and redirects
      operationId: link_check_v1_link_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkCheckBody"
        required: true
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Link Check V1 Link Check Post
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /v1/chunk-markdown:
    post:
      tags:
        - chunk
      summary: Split Markdown into heading-aware chunks
      operationId: chunk_markdown_endpoint_v1_chunk_markdown_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChunkBody"
        required: true
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Chunk Markdown Endpoint V1 Chunk Markdown Post
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /v1/shape:
    post:
      tags:
        - json
      summary: "Turn key:value notes, CSV, or a Markdown table into JSON"
      operationId: shape_endpoint_v1_shape_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShapeBody"
        required: true
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Shape Endpoint V1 Shape Post
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /v1/flatten-json:
    post:
      tags:
        - json
      summary: Flatten nested JSON into dotted keys
      operationId: flatten_endpoint_v1_flatten_json_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlattenBody"
        required: true
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Flatten Endpoint V1 Flatten Json Post
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
components:
  schemas:
    Body_pdf_tables_v1_pdf_tables_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: A text PDF (not a scan).
        pages:
          anyOf:
            - type: string
            - type: "null"
          title: Pages
          description: "Pages to read, like 1,3-5. Default: all."
        strategy:
          type: string
          enum:
            - auto
            - lines
            - text
          title: Strategy
          default: auto
        output:
          type: string
          enum:
            - json
            - csv
          title: Output
          default: json
      type: object
      required:
        - file
      title: Body_pdf_tables_v1_pdf_tables_post
    Body_to_markdown_v1_to_markdown_post:
      properties:
        file:
          anyOf:
            - type: string
              contentMediaType: application/octet-stream
            - type: "null"
          title: File
          description: "A .pdf, .html, or .htm file."
        html:
          anyOf:
            - type: string
            - type: "null"
          title: Html
          description: "Raw HTML text, if you are not uploading a file."
        pages:
          anyOf:
            - type: string
            - type: "null"
          title: Pages
          description: "PDF pages to read, like 1,3-5. Default: all."
        tables:
          type: string
          enum:
            - lines
            - text
            - off
          title: Tables
          default: lines
        password:
          anyOf:
            - type: string
            - type: "null"
          title: Password
          description: "PDF password, if the file is locked."
      type: object
      title: Body_to_markdown_v1_to_markdown_post
    ChunkBody:
      properties:
        text:
          type: string
          maxLength: 400000
          minLength: 1
          title: Text
        max_chars:
          type: integer
          maximum: 20000.0
          minimum: 200.0
          title: Max Chars
          default: 1500
        overlap_chars:
          type: integer
          maximum: 5000.0
          minimum: 0.0
          title: Overlap Chars
          default: 0
        prefix_path:
          type: boolean
          title: Prefix Path
          default: false
        source:
          type: string
          title: Source
          default: ""
      type: object
      required:
        - text
      title: ChunkBody
    FlattenBody:
      properties:
        data:
          title: Data
        text:
          anyOf:
            - type: string
            - type: "null"
          title: Text
        separator:
          type: string
          maxLength: 5
          minLength: 1
          title: Separator
          default: .
      type: object
      title: FlattenBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LinkCheckBody:
      properties:
        urls:
          items:
            type: string
          type: array
          maxItems: 25
          minItems: 1
          title: Urls
        timeout:
          type: number
          maximum: 8.0
          minimum: 1.0
          title: Timeout
          default: 5.0
      type: object
      required:
        - urls
      title: LinkCheckBody
    ShapeBody:
      properties:
        text:
          type: string
          maxLength: 400000
          minLength: 1
          title: Text
        format:
          type: string
          enum:
            - auto
            - kv
            - csv
            - markdown
          title: Format
          default: auto
      type: object
      required:
        - text
      title: ShapeBody
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
tags:
  - name: health
    description: Liveness and readiness. No secret required.
  - name: pdf-tables
    description: Pull tables out of a text PDF.
  - name: markdown
    description: Turn a text PDF or HTML into Markdown.
  - name: links
    description: Check links for status codes and redirects.
  - name: chunk
    description: Split Markdown into heading-aware chunks.
  - name: json
    description: "Shape messy text into JSON, or flatten nested JSON."
servers:
  - url: "https://YOUR-SERVICE.onrender.com"
    description: "Replace with the Render URL after deploy, then Rapid's proxy URL once listed."
